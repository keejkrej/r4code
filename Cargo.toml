[package]
name = "r4code"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Rust port of T3 Code / g0code targeting Rune for the desktop shell"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = "2.2"
getrandom = "0.3"
hex = "0.4"
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "r4code-mcp"
path = "src/bin/r4code-mcp.rs"
